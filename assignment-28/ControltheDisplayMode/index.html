<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A demonstration of inline, block, and inline-block display behavior.">
    <link rel="stylesheet" href="styles.css">
    <title>CSS Display Practice</title>
</head>

<body>

    <header>
        <h1>CSS Display Practice</h1>
        <p>Compare inline, block, and inline-block behavior.</p>
    </header>

    <main>

        <section id="inline-demo">
            <h2>Inline</h2>

            <span>Item One</span>
            <span>Item Two</span>
            <span>Item Three</span>
        </section>

        <section id="block-demo">
            <h2>Block</h2>

            <span>Item One</span>
            <span>Item Two</span>
            <span>Item Three</span>
        </section>

        <section id="inline-block-demo">
            <h2>Inline-Block</h2>

            <span>Item One</span>
            <span>Item Two</span>
            <span>Item Three</span>
        </section>

    </main>

</body>

</html>
